name: Despliegue a la Nube (CD)

on:
  push:
    branches: [ "main" ]

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Traer el código y el Dockerfile
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y subir la imagen (Build & Push)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/mi-api-nube:latest
